<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Controllo ESP32 - luma-esp</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
      .pannello-comandi { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      button { padding: 10px 14px; font-weight: bold; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
      #log { background: #1e1e1e; color: #00ffcc; padding: 12px; border-radius: 6px; font-family: monospace; height: 300px; overflow-y: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Inizializzazione Bridge ESP32 (L3)</h1>

    <div class="pannello-comandi">
      <button id="btn-status">1. Status</button>
      <button id="btn-scan">2. Scan Motori</button>
      <button id="btn-config" style="background: #e3f2fd;">3. Invia Profilo (Config.set)</button>
      <button id="btn-arm" style="background: #4caf50; color: white; border: none;">4. Arm</button>
      <button id="btn-disarm" style="background: #f44336; color: white; border: none;">Disarm</button>
    </div>

    <h3>Log Eventi WebSocket:</h3>
    <div id="log">In attesa di connessione...</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
